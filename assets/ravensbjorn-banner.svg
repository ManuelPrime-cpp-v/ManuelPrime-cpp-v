<svg width="1000" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://w3.org">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090C10"/>
      <stop offset="50%" stop-color="#0F141D"/>
      <stop offset="100%" stop-color="#090C10"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="60" y1="40" x2="220" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="250" y1="0" x2="950" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#475569" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Base Forged Metal Plate -->
  <rect width="1000" height="240" rx="8" fill="url(#bgGrad)"/>
  <rect width="1000" height="240" rx="8" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="238" rx="7" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Corner Architectural Brackets -->
  <path d="M 16 32 L 16 16 L 32 16" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M 984 32 L 984 16 L 968 16" stroke="#475569" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M 16 208 L 16 224 L 32 224" stroke="#475569" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M 984 208 L 984 224 L 968 224" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Minimalist Runic / Geometric Diamond Frame (Left Emblem) -->
  <g transform="translate(135, 120)">
    <polygon points="0,-78 78,0 0,78 -78,0" stroke="#1E293B" stroke-width="1.5" fill="#0B0F17"/>
    <polygon points="0,-64 64,0 0,64 -64,0" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>
    
    <!-- Geometric Raven Silhouette & Precision Wing Lines -->
    <!-- Head & Beak -->
    <polygon points="-14,-36 6,-42 36,-32 10,-24 -8,-18" fill="#E2E8F0"/>
    <polygon points="10,-24 36,-32 14,-20" fill="#38BDF8"/>
    <!-- Upper Wing Blade -->
    <polygon points="-8,-18 -46,-10 -54,14 -12,4" fill="url(#wingGrad)"/>
    <!-- Mid Wing Blade -->
    <polygon points="-12,4 -48,22 -34,36 -2,18" fill="#64748B"/>
    <!-- Lower Tail Geometry -->
    <polygon points="-2,18 -24,48 -8,52 6,24" fill="#334155"/>
    <!-- Core Chest / Spine -->
    <polygon points="-8,-18 10,-24 6,24 -12,4" fill="#CBD5E1"/>
  </g>

  <!-- Vertical Architectural Divider -->
  <line x1="245" y1="42" x2="245" y2="198" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="243.5" y="70" width="3" height="28" fill="#38BDF8"/>

  <!-- Primary Brand Typography -->
  <text x="275" y="102" fill="#F8FAFC" font-family="'JetBrains Mono', 'Fira Code', monospace, sans-serif" font-size="38" font-weight="700" letter-spacing="8">
    RAVENSBJORN
  </text>

  <!-- Horizontal Precision Rule -->
  <rect x="275" y="118" width="660" height="1.5" fill="url(#lineGlow)"/>

  <!-- Signature Philosophy -->
  <text x="277" y="148" fill="#38BDF8" font-family="'JetBrains Mono', 'Fira Code', monospace, sans-serif" font-size="15" font-weight="600" letter-spacing="6">
    INTELLIGENT SPEED
  </text>

  <!-- Sub-label: Engineering Direction -->
  <text x="277" y="180" fill="#94A3B8" font-family="'JetBrains Mono', 'Fira Code', monospace, sans-serif" font-size="12" letter-spacing="2.5">
    COMPUTATIONAL PERFORMANCE ENGINEERING  //  SYSTEMS &amp; ARCHITECTURE
  </text>

  <!-- Subtle Right-Side Telemetry / Runic Accent -->
  <g transform="translate(925, 120)" opacity="0.55">
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#475569" stroke-width="1.2"/>
    <polyline points="0,-35 16,-18 0,0" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
    <polyline points="0,0 16,18 0,35" fill="none" stroke="#64748B" stroke-width="1.2"/>
  </g>
</svg>
